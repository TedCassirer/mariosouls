name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Pinned build dependencies
        run: python tools/dependencies.py --setup --download-toolchain
      - name: Shared checks (no game or ROM)
        run: python tools/framework.py test --shared-only
      - name: Distribution source audit
        run: python tools/release.py check
      - name: Compile host, Mario adapter and runtime
        run: python tools/framework.py build --with-runtime
      - name: Test report and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-check-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/framework-build/shared-test-report.json
            work/framework-build/**/*.build.log
