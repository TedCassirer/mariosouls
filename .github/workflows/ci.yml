name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Source formatting
        run: python tools/framework.py format --check
      - name: Pinned build dependencies
        run: python tools/dependencies.py --setup --download-toolchain
      - name: Shared checks (no game or ROM)
        run: python tools/framework.py test --shared-only
      - name: Distribution source audit
        run: python tools/release.py check
      - name: Compile host, Mario adapter and runtime
        run: python tools/framework.py build --with-runtime
      - name: Test report and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-check-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/framework-build/shared-test-report.json
            work/framework-build/**/*.build.log
            work/framework-build/test-results/
